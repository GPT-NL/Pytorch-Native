  # Epoch 2
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_dataset_v2.0_tokenized/buckets_split_validate/code/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_dataset_v2.0_tokenized/buckets_split_validate/dutch_high_quality/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_dataset_v2.0_tokenized/buckets_split_validate/dutch_low_medium_quality/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_dataset_v2.0_tokenized/buckets_split_validate/english_high_quality/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_dataset_v2.0_tokenized/buckets_split_validate/english_low_medium_quality/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_dataset_v2.0_tokenized/buckets_split_validate/new_high_quality/*.npy

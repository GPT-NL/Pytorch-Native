data_root: /INSERT-GPT-NL-TRAINING-DIR/context_lengthening/phase3_annealing_context_lengthening_mix/mix_annealing_only_20260302_085042/*.npy
#data_root: /INSERT-GPT-NL-TRAINING-DIR/context_lengthening/gpt-nl.2.0-shorter-than-32k-val-hq/*.npy # 5.4B
#data_root: /INSERT-GPT-NL-TRAINING-DIR/context_lengthening/gpt-nl.2.0-shorter-than-32k-annealing-hq/*.npy #129.6B
#data_root: /INSERT-GPT-NL-TRAINING-DIR/context_lengthening/gpt-nl.2.0-32k-annealing-hq/*.npy #23.3B
# data_root: /INSERT-GPT-NL-TRAINING-DIR/context_lengthening/gpt-nl.2.0-32k-val-hq/*.npy #1.06B


# set this to true only on the first run with a new dataset, then set again to false
# TODO: change this back to false after the first run
restart_with_new_data: true
data_root_val:
 #  - /INSERT-GPT-NL-DATALOADER-DIR/dataset/sample-gpt_nl_dataset_v1.0_tokenized/val/*.npy # just to test (proper validation below raises `RuntimeError: Failed to produce any documents from`)
  
  # Epoch 1
  # - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/splitted_buckets_validate/code/*.npy
  # - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/splitted_buckets_validate/dutch_high_quality/*.npy

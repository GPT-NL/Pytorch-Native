num_nodes: ${oc.env:SLURM_JOB_NUM_NODES,1}
seed: 47
per_device_batch_size: ${oc.env:PER_DEVICE_BATCH_SIZE,12}
gradient_accumulation_steps: ${oc.env:GRADIENT_ACCUMULATION_STEPS,1}


# Training setup
max_duration:
  #tokens: 10000000000 # limit by tokens (-1 means disabled)
  epochs: 5 # limit epochs (increase this by 1 at the end of epoch)
hard_stop: -1
load_path: ${oc.env:LOAD_PATH, null}

# Model
model_name: llama3-26B
sequence_length: 32768
tokenizer_name: gpt-nl
model_compile: true
use_flash_attention_2: true


# Checkpoint
save_dir: ${oc.env:CHECKPOINT_DIR, /INSERT-GPT-NL-TRAINING-DIR/OLMo-core/${model_name}-mbs-${per_device_batch_size}-gas-${gradient_accumulation_steps}-${oc.env:SLURM_JOB_ID,""}}
work_dir: ${oc.env:TMPDIR, /INSERT-GPT-NL-TRAINING-DIR/${oc.env:USER}}
save_interval: 880 # to do perfect resume on (22, 20, 11, 10, 5, 2) nodes without data repetition # https://ci.tno.nl/gitlab/gpt-nl/model-development/pytorch_native/-/issues/15. 
ephemeral_save_interval: 110 # with this one still can do perfect resume on (22, 11, 10, 5, 2) nodes
save_async: true

# Data 
num_workers: 0
# main phase
# data_root: /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/train_datamixtures/primary/*.npy # Epoch 1

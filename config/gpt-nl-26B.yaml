  # - /INSERT-GPT-NL-TRAINING-DIR/debug_sets/epoch_2_english_low_medium_quality/*.npy
  # - /INSERT-GPT-NL-TRAINING-DIR/debug_sets/epoch_2_new_high_quality/*.npy
  # - /INSERT-GPT-NL-TRAINING-DIR/debug_sets/epoch_2_new_low_medium_quality/*.npy

  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_dataset_v2.0_tokenized/buckets_split_validate/other_languages/*.npy


# Evaluation
evaluation:
  lm_eval:
    enabled: true
    interval: 500
    max_steps: 500 
  downstream_tasks:
    enabled: true
    interval: 500
    max_steps: 500

# Optimizer
learning_rate: 3e-5
weight_decay: 0.1
betas: [0.9, 0.95]
z_loss_multiplier: 0
max_grad_norm: 1.0
optimizer_compile: false

# Scheduler
scheduler:
  type: WSD
  warmup_min_lr: 3e-5
  decay_min_lr: 1e-5

  # # for the primary datamix phase, first epoch, warmup LR at the beginning
  # warmup_steps: 2000
  # decay_steps: 0

  # for epoch 2+ of primary datamix, keeping constant LR
  #warmup_steps: 0
  #warmup_delay: 0
  warmup_fraction: 0.0
  decay_steps: 3124
  decay_fraction: null
  # # for the last datamix phase (annealing), LR will go triangularly down
  # warmup_steps: 0
  # decay_steps: 12448  # number of annealing steps, verified by debug run 
#  decay_fraction: 0.15 # ANNEALING_RATIO / primary_epochs (no problem of world size changing)


rope_scaling:
  # The 'type' key tells the function which class to instantiate
  type: YaRNRoPEScalingConfig
  # These are the keyword arguments passed to YaRNRoPEScalingConfig(...)
  factor: 8
  beta_fast: 32
  beta_slow: 1
  old_context_len: 4096

run_name: OLMo-core-${model_name}-mbs-${per_device_batch_size}-gas-${gradient_accumulation_steps}-nodes-${num_nodes}-${oc.env:SLURM_JOB_ID,""}

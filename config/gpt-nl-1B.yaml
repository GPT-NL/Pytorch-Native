num_nodes: ${oc.env:SLURM_JOB_NUM_NODES,1}
seed: 47
per_device_batch_size: ${oc.env:PER_DEVICE_BATCH_SIZE,8}
gradient_accumulation_steps: ${oc.env:GRADIENT_ACCUMULATION_STEPS,1}


# Training setup
max_duration:
  tokens: -1 # limit by tokens (-1 means disabled)
  epochs: 3 # limit epochs (increase this by 1 at the end of epoch)
hard_stop: -1
load_path: ${oc.env:LOAD_PATH, null}

# Model
model_name: llama3-1B
sequence_length: 4096
tokenizer_name: gpt-nl
model_compile: true
use_flash_attention_2: true


# Checkpoint
save_dir: ${oc.env:CHECKPOINT_DIR, /INSERT-GPT-NL-TRAINING-DIR/OLMo-core/${model_name}-mbs-${per_device_batch_size}-gas-${gradient_accumulation_steps}-${oc.env:SLURM_JOB_ID,""}}
work_dir: ${oc.env:TMPDIR, /INSERT-GPT-NL-TRAINING-DIR/${oc.env:USER}}
save_interval: 50
ephemeral_save_interval: 10
save_async: true

# Data 
num_workers: 0
# main phase
data_root: /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/train_datamixtures/primary/*.npy
# annealing phase
# data_root: /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/train_datamixtures/annealing/*.npy
# set this to true only on the first run with a new dataset, then set again to false
restart_with_new_data: false
data_root_val:
  # - /INSERT-GPT-NL-DATALOADER-DIR/dataset/sample-gpt_nl_dataset_v1.0_tokenized/val/*.npy # just to test (proper validation below raises `RuntimeError: Failed to produce any documents from`)
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/splitted_buckets_validate/code/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/splitted_buckets_validate/dutch_high_quality/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/splitted_buckets_validate/dutch_low_medium_quality/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/splitted_buckets_validate/english_high_quality/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/splitted_buckets_validate/english_low_medium_quality/*.npy
  - /INSERT-GPT-NL-TRAINING-DIR/gpt_nl_1.0_tokenized/splitted_buckets_validate/other_languages/*.npy

# Evaluation
evaluation:
  lm_eval:
    enabled: true
    interval: 50
    max_steps: 100
  downstream_tasks:
    enabled: true
    interval: 50
    max_steps: 100

# Optimizer
learning_rate: 2e-4
weight_decay: 0.1
betas: [0.9, 0.95]
z_loss_multiplier: 1e-5
max_grad_norm: 1.0
optimizer_compile: false

# Scheduler
scheduler:
  type: WSD
  warmup_min_lr: 3e-5
  decay_min_lr: 3e-5

  # # for the primary datamix phase, first epoch, warmup LR at the beginning
  warmup_steps: 10
  decay_steps: 0

  # # for epoch 2+ of primary datamix, keeping constant LR
  # warmup_steps: 0
  # decay_steps: 0

  # # for the last datamix phase (annealing), LR will go triangularly down
  # warmup_steps: 0
  # decay_steps: 68592 # put here the exact number of steps of the annealing (world size change is a problem): 6236 for 22 nodes, 68592 for 2 nodes
  # decay_fraction: 0.15 # ANNEALING_RATIO / primary_epochs (no problem of world size changing)


run_name: OLMo-core-${model_name}-mbs-${per_device_batch_size}-gas-${gradient_accumulation_steps}-nodes-${num_nodes}-${oc.env:SLURM_JOB_ID,""}